<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockmate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="statusbar">
    <div class="pills">
      <span id="conn" class="pill pill-warn">连接中</span>
      <span id="online" class="pill">离线</span>
      <span id="task" class="pill">无任务</span>
      <span id="health" class="pill" title="生命值">♥ --</span>
      <span id="dim" class="pill" title="所在维度">--</span>
      <span id="model" class="pill" title="大模型">模型 --</span>
      <span id="keeper" class="pill" title="MacBook 上的守护进程">keeper 未连</span>
    </div>
    <div class="actions">
      <button id="keeper-start" class="btn btn-small" type="button" disabled title="让 keeper 启动游戏客户端">叫它上线</button>
      <button id="keeper-stop" class="btn btn-small" type="button" disabled title="让 keeper 关闭游戏客户端">让它下线</button>
      <button id="stop" class="btn btn-stop" type="button" title="立刻停下，不经过模型">停</button>
    </div>
  </header>

  <main>
    <section id="chat" aria-live="polite"></section>
    <details id="prefs" hidden>
      <summary>待确认的偏好 <span id="prefs-count" class="badge">0</span></summary>
      <ul id="prefs-list"></ul>
    </details>
  </main>

  <footer>
    <form id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="和它说点什么…" maxlength="2000">
      <button id="send" class="btn" type="submit">发送</button>
    </form>
  </footer>

  <dialog id="token-dialog">
    <form method="dialog" id="token-form">
      <h2>输入口令</h2>
      <p>就是后台 config.yaml 里的 token，只需输一次，存在这个浏览器里。</p>
      <input id="token-input" type="password" placeholder="token" autocomplete="off" required>
      <div class="dialog-actions"><button class="btn" type="submit">连接</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
