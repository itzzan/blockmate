# 怪物名单（知识层，guide-3 任务单 19）：伙伴能打什么、只躲什么、永远不碰什么。
#
# 铁规矩 5：战斗只对敌对生物。代码里只有一条判断："在 hostile 名单上才打"，没有别的例外；
# 要改"打不打末影人"这类事改这个文件，不改代码。
# 后台在伙伴连上来（hello）时随白名单下发，改了会自动重新读并推给在线的伙伴（任务单 19 起不用重连）。
# 写法：一行一个实体 id，没写 minecraft: 前缀后台会补。
#
#   hostile：可以打（它靠到 3 格内或先动手就还手）。
#   flee_only：只躲不打（苦力怕炸、幻翼飞、监守者打不过）。
#   never：永远不碰，哪怕它先动手（玩家、村民、所有动物、铁傀儡…）。
#   hostile_at_night：夜里才算怪（蜘蛛白天不主动咬人）。
#   hostile_if_attacked：它先动手才算怪（蜘蛛白天、末影人、僵尸猪灵没激怒时都不碰）。
# 同一个 id 出现在多段时：never 最大，其次 flee_only，再是 hostile；at_night / if_attacked 只对不在前三段里的生效。

