# 伙伴能挖什么、绝不碰什么、能放什么、挖了掉什么（知识层，guide-2 任务单 12 / 13）
#
# 规则只有两条，写在这里以外的地方一律不许挖、不许放：
#   1. 方块不在 mineable 里 → 不挖。never_touch 只是给人看的说明，提醒哪些东西"看起来像建筑"，程序不用它。
#   2. 物品不在 placeable 里 → 不放。放了工作台用完要收回。
#
# 后台在伙伴连上来（hello）时把 mineable 和 placeable 发给模组，模组不自己读文件。
# 改了这个文件后台会自动重新读，但伙伴要下线再上线才拿到新清单。
# 写法：一行一个物品 id；没写 minecraft: 前缀后台会补上。

mineable:
  # 原木（8 种）
  - minecraft:oak_log
  - minecraft:spruce_log
  - minecraft:birch_log
  - minecraft:jungle_log
  - minecraft:acacia_log
  - minecraft:dark_oak_log
  - minecraft:mangrove_log
  - minecraft:cherry_log
  # 石头类（圆石和深板岩圆石故意不在：野外几乎没有天然圆石，房子的墙倒多半是它；"挖圆石"后台会换成挖石头）
  - minecraft:stone
  - minecraft:deepslate
  # 泥沙类
  - minecraft:dirt
  - minecraft:sand
  - minecraft:gravel
  # 矿（及深板岩变种）
  - minecraft:coal_ore
  - minecraft:deepslate_coal_ore
  - minecraft:iron_ore
  - minecraft:deepslate_iron_ore
  - minecraft:copper_ore
  - minecraft:deepslate_copper_ore
  # 任务单 18 加的矿（主人定）：钻石、金、红石、青金石、绿宝石；黑曜石故意不加（都在岩浆边，任务单 22 建传送门时再定）
  - minecraft:diamond_ore
  - minecraft:deepslate_diamond_ore
  - minecraft:gold_ore
  - minecraft:deepslate_gold_ore
  - minecraft:redstone_ore
  - minecraft:deepslate_redstone_ore
  - minecraft:lapis_ore
  - minecraft:deepslate_lapis_ore
  - minecraft:emerald_ore
  - minecraft:deepslate_emerald_ore

# 挖掉之后背包里多的是什么（没写的 = 和方块同名）。模组按这个数"挖够了没有"；后台也用它把"挖 10 个圆石"换成"挖石头"。
drops:
  minecraft:stone: minecraft:cobblestone
  minecraft:deepslate: minecraft:cobbled_deepslate
  minecraft:coal_ore: minecraft:coal
  minecraft:deepslate_coal_ore: minecraft:coal
  minecraft:iron_ore: minecraft:raw_iron
  minecraft:deepslate_iron_ore: minecraft:raw_iron
  minecraft:copper_ore: minecraft:raw_copper
  minecraft:deepslate_copper_ore: minecraft:raw_copper
  minecraft:diamond_ore: minecraft:diamond
  minecraft:deepslate_diamond_ore: minecraft:diamond
  minecraft:gold_ore: minecraft:raw_gold
  minecraft:deepslate_gold_ore: minecraft:raw_gold
  minecraft:redstone_ore: minecraft:redstone
  minecraft:deepslate_redstone_ore: minecraft:redstone
  minecraft:lapis_ore: minecraft:lapis_lazuli
  minecraft:deepslate_lapis_ore: minecraft:lapis_lazuli
  minecraft:emerald_ore: minecraft:emerald
  minecraft:deepslate_emerald_ore: minecraft:emerald

# 徒手挖了不掉东西、必须拿镐的方块（真游戏预检 2026-10-27：没镐挖了 5 分钟石头一块圆石都没有）。
# 模组开挖前查：清单里的方块而背包没有任何镐 → 回 no_materials（缺 pickaxe），不去白挖。
needs_pickaxe:
  - minecraft:stone
  - minecraft:deepslate
  - minecraft:coal_ore
  - minecraft:deepslate_coal_ore
  - minecraft:iron_ore
  - minecraft:deepslate_iron_ore
  - minecraft:copper_ore
  - minecraft:deepslate_copper_ore
  - minecraft:diamond_ore          # 钻石、金、红石、绿宝石要铁镐，青金石要石镐；镐不够档次挖了也不掉，模组按"有没有镐"粗判
  - minecraft:deepslate_diamond_ore
  - minecraft:gold_ore
  - minecraft:deepslate_gold_ore
  - minecraft:redstone_ore
  - minecraft:deepslate_redstone_ore
  - minecraft:lapis_ore
  - minecraft:deepslate_lapis_ore
  - minecraft:emerald_ore
  - minecraft:deepslate_emerald_ore
  - minecraft:furnace          # 收回自己放的熔炉也要镐

never_touch:
  # 只是说明：这些一看就是别人的东西或房子的一部分，哪怕主人叫它碰也不碰
  - 箱子、木桶、潜影盒、熔炉、高炉、烟熏炉、附魔台、酿造台
  - 所有门、活板门、栅栏门、栅栏、墙
  - 所有床、告示牌、玻璃、楼梯、台阶、地毯、画、物品展示框
  - 任何人工摆放的方块：石砖、木板、砂岩雕刻等等

placeable:
  - minecraft:crafting_table
  - minecraft:torch
  # 床（16 色，伙伴只放自己的床）
  - minecraft:white_bed
  - minecraft:orange_bed
  - minecraft:magenta_bed
  - minecraft:light_blue_bed
  - minecraft:yellow_bed
  - minecraft:lime_bed
  - minecraft:pink_bed
  - minecraft:gray_bed
  - minecraft:light_gray_bed
  - minecraft:cyan_bed
  - minecraft:purple_bed
  - minecraft:blue_bed
  - minecraft:brown_bed
  - minecraft:green_bed
  - minecraft:red_bed
  - minecraft:black_bed
